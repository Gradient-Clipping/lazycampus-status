name: Verify and publish status page
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: status-page-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ccr.ccs.tencentyun.com
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: docker compose -f compose.test.yml up -d --wait
      - run: npm test
        env:
          STATUS_TEST_MYSQL: "1"
      - run: npm run test:ui
      - name: Stop test database
        if: always()
        run: docker compose -f compose.test.yml down --volumes
  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/lazycampus/lazycampus-status:1.0.${{ github.run_number }}
            ${{ env.REGISTRY }}/lazycampus/lazycampus-status:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
