services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-test-only-root
      MYSQL_DATABASE: status_test
      MYSQL_USER: status_test
      MYSQL_PASSWORD: local-test-only-password
    ports:
      - "127.0.0.1:3311:3306"
    healthcheck:
      test:
        [
          CMD-SHELL,
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
    tmpfs:
      - /var/lib/mysql
